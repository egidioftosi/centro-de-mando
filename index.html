// ── STORAGE (Supabase) ────────────────────────────────────────
async function loadFromDB(table, fallback) {
  try {
    const { data, error } = await dbClient.from(table).select("*");
    if (error || !data || data.length === 0) return fallback;
    return data;
  } catch { return fallback; }
}

async function upsertToDB(table, records) {
  try {
    await dbClient.from(table).upsert(records, { onConflict: "id" });
  } catch {}
}

async function deleteFromDB(table, id) {
  try {
    await dbClient.from(table).delete().eq("id", id);
  } catch {}
}

                      <span style={{ fontSize: 13, color: m.completado ? "#aaa" : "#2a2a2a", textDecoration: m.completado ? "line-through" : "none", flex: 1 }}>{m.texto}</span>
                      <span style={{ fontSize: 11, color: "#bbb", fontFamily: "'DM Mono'" }}>#{i + 1}</span>
                      <button className="del-btn" onClick={() => deleteMovimiento(m.id)} style={{ fontSize: 16, color: "#ccc" }}>×</button>
                    </div>
                  );
                })}
                {movimientos.length === 0 && <div style={{ fontSize: 13, color: "#bbb", padding: "20px", textAlign: "center", ...S.card }}>Sin movimientos — añade tus 3 prioridades del día</div>}
              </div>
            </div>

            {/* Company cards */}
            <div style={{ ...S.label, marginBottom: 12 }}>Estado por empresa</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
              {Object.values(companies).map(co => {
                const activos = pendientes.filter(p => p.empresa === co.id && p.estado !== "completado");
                const altas = activos.filter(p => p.prioridad === "alta");
                const completados = pendientes.filter(p => p.empresa === co.id && p.estado === "completado").length;
                const total = pendientes.filter(p => p.empresa === co.id).length;
                const pct = total > 0 ? Math.round((completados / total) * 100) : 0;
                return (
                  <div key={co.id} className="hovcmp" onClick={() => { setActiveCompany(co.id); setActiveSubunit(null); setView("empresa"); }} style={{ ...S.card, padding: "18px 20px", borderTop: `3px solid ${co.color}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "#1e1e1e", marginBottom: 2 }}>{co.name}</div>
                        <div style={{ fontSize: 11, color: "#999" }}>{co.sector}</div>
                      </div>
                      <span style={{ fontFamily: "'DM Mono'", fontSize: 10, color: co.color, background: `${co.color}18`, padding: "2px 8px", borderRadius: 4 }}>{co.short}</span>
                    </div>
                    {co.subunits && (
                      <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 10 }}>
                        {co.subunits.map(su => {
                          const suAltas = pendientes.filter(p => p.empresa === co.id && p.subunit === su.id && p.prioridad === "alta" && p.estado !== "completado");
                          return <span key={su.id} style={{ fontSize: 9, color: su.color, background: `${su.color}12`, padding: "2px 7px", borderRadius: 4, fontFamily: "'DM Mono'" }}>{su.short}{suAltas.length > 0 ? ` ·${suAltas.length}` : ""}</span>;
                        })}
                      </div>
                    )}
                    <div style={{ display: "flex", gap: 16, marginBottom: 10 }}>
                      <div><div style={{ fontSize: 22, fontWeight: 700 }}>{activos.length}</div><div style={{ fontSize: 10, color: "#999" }}>pendientes</div></div>
                      <div><div style={{ fontSize: 22, fontWeight: 700, color: altas.length > 0 ? "#C04A4A" : "#ccc" }}>{altas.length}</div><div style={{ fontSize: 10, color: "#999" }}>críticos</div></div>
                    </div>
                    <div style={{ height: 4, background: "#e8e4de", borderRadius: 2, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: co.color, borderRadius: 2 }} />
                    </div>
                    <div style={{ fontSize: 10, color: "#bbb", marginTop: 5 }}>{pct}% completado</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ══ POR EMPRESA ══ */}
        {view === "empresa" && (
          <div style={{ padding: "24px 28px" }}>
            <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
              {Object.values(companies).map(co => (
                <button key={co.id} className="tabpill navbtn" onClick={() => { setActiveCompany(co.id); setActiveSubunit(null); }} style={{ padding: "7px 16px", borderRadius: 8, fontSize: 12, fontWeight: 500, background: activeCompany === co.id ? `${co.color}18` : "#faf8f5", color: activeCompany === co.id ? co.color : "#888", border: `1px solid ${activeCompany === co.id ? co.color : "#ddd9d4"}` }}>{co.name}</button>
              ))}
            </div>
            {activeCompany === "karnatka" && (
              <div style={{ display: "flex", gap: 5, marginBottom: 16 }}>
                <button className="tabpill navbtn" onClick={() => setActiveSubunit(null)} style={{ padding: "5px 12px", borderRadius: 6, fontSize: 11, fontFamily: "'DM Mono'", background: !activeSubunit ? "#e8e4de" : "transparent", color: !activeSubunit ? "#1e1e1e" : "#aaa", border: "1px solid #ddd9d4" }}>Todas</button>
                {company.subunits.map(su => (
                  <button key={su.id} className="tabpill navbtn" onClick={() => setActiveSubunit(su.id)} style={{ padding: "5px 12px", borderRadius: 6, fontSize: 11, fontFamily: "'DM Mono'", background: activeSubunit === su.id ? `${su.color}18` : "transparent", color: activeSubunit === su.id ? su.color : "#aaa", border: `1px solid ${activeSubunit === su.id ? su.color : "#ddd9d4"}` }}>{su.name}</button>
                ))}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
              {[
                { label: "Activos", value: currentPendientes.filter(p => p.estado !== "completado").length, trend: "neutral" },
                { label: "Críticos", value: currentPendientes.filter(p => p.prioridad === "alta" && p.estado !== "completado").length, trend: currentPendientes.filter(p => p.prioridad === "alta" && p.estado !== "completado").length > 0 ? "down" : "up" },
                { label: "En proceso", value: currentPendientes.filter(p => p.estado === "en-proceso").length, trend: "neutral" },
                { label: "Completados", value: currentPendientes.filter(p => p.estado === "completado").length, trend: "up" },
              ].map((k, i) => <KpiCard key={i} {...k} />)}
            </div>
            {activeCompany === "karnatka" && !activeSubunit ? (
              company.subunits.map(su => {
                const suP = pendientes.filter(p => p.empresa === "karnatka" && p.subunit === su.id);
                return (
                  <div key={su.id} style={{ marginBottom: 20 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <span style={{ fontFamily: "'DM Mono'", fontSize: 10, color: su.color, background: `${su.color}18`, padding: "2px 8px", borderRadius: 4 }}>{su.short}</span>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "#2a2a2a" }}>{su.name}</span>
                      <span style={{ fontSize: 11, color: "#aaa" }}>{suP.filter(p => p.estado !== "completado").length} activos</span>
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                      {suP.map(p => <PendienteRow key={p.id} p={p} onToggle={() => cycleEstado(p.id)} onDelete={() => deletePendiente(p.id)} color={su.color} accent={su.accent} />)}
                    </div>
                  </div>
                );
              })
            ) : (
              <div>
                <div style={{ ...S.label, marginBottom: 10 }}>Pendientes — {currentPendientes.filter(p => p.estado !== "completado").length} activos</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {[...currentPendientes].sort((a, b) => ({ alta: 0, media: 1, baja: 2 }[a.prioridad] - { alta: 0, media: 1, baja: 2 }[b.prioridad])).map(p => (
                    <PendienteRow key={p.id} p={p} onToggle={() => cycleEstado(p.id)} onDelete={() => deletePendiente(p.id)} color={currentColor} accent={currentAccent} />
                  ))}
                  {currentPendientes.length === 0 && <div style={{ fontSize: 13, color: "#bbb", padding: "20px", textAlign: "center", ...S.card }}>Sin pendientes en esta vista</div>}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ══ CRÍTICOS ══ */}
        {view === "criticos" && (
          <div style={{ padding: "24px 28px" }}>
            <div style={{ ...S.label, marginBottom: 16 }}>Críticos ahora — prioridad Alta · no completados</div>
            {Object.values(companies).map(co => {
              const criticos = pendientes.filter(p => p.empresa === co.id && p.prioridad === "alta" && p.estado !== "completado");
              if (criticos.length === 0) return null;
              return (
                <div key={co.id} style={{ marginBottom: 18 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                    <span style={{ fontFamily: "'DM Mono'", fontSize: 10, color: co.color, background: `${co.color}18`, padding: "2px 8px", borderRadius: 4 }}>{co.short}</span>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>{co.name}</span>
                    <span style={{ fontSize: 11, color: "#C04A4A" }}>{criticos.length} críticos</span>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                    {criticos.map(p => {
                      const su = p.subunit ? co.subunits?.find(s => s.id === p.subunit) : null;
                      const dc = su ? su.color : co.color;
                      const da = su ? su.accent : co.accent;
                      return (
                        <div key={p.id} className="hovrow" style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 14px", background: "#faf8f5", border: "1px solid #e8e4de", borderRadius: 9 }}>
                          <span className="statcyc" onClick={() => cycleEstado(p.id)} style={{ fontSize: 14, color: p.estado === "en-proceso" ? da : "#ccc", minWidth: 18, textAlign: "center" }}>{EST[p.estado]}</span>
                          {su && <span style={{ fontFamily: "'DM Mono'", fontSize: 9, color: su.color, background: `${su.color}12`, padding: "1px 6px", borderRadius: 3 }}>{su.short}</span>}
                          <span style={{ fontSize: 13, color: "#2a2a2a", flex: 1 }}>{p.texto}</span>
                          <span style={{ fontSize: 10, color: "#aaa", fontFamily: "'DM Mono'" }}>{p.area}</span>
                          <Avatar name={p.responsable} color={dc} />
                          <span style={{ fontSize: 10, color: "#bbb", fontFamily: "'DM Mono'" }}>{p.fecha}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            {pendientes.filter(p => p.prioridad === "alta" && p.estado !== "completado").length === 0 && (
              <div style={{ fontSize: 14, color: "#3A9E6B", padding: "32px", textAlign: "center", ...S.card }}>✓ Sin pendientes críticos activos</div>
            )}
          </div>
        )}

        {/* ══ SEMANAL ══ */}
        {view === "semanal" && (
          <div style={{ padding: "24px 28px" }}>
            <div style={{ ...S.label, marginBottom: 20 }}>Revisión semanal</div>
            {Object.values(companies).map(co => {
              const allP = pendientes.filter(p => p.empresa === co.id);
              const activos = allP.filter(p => p.estado !== "completado");
              const completados = allP.filter(p => p.estado === "completado").length;
              const pct = allP.length > 0 ? Math.round((completados / allP.length) * 100) : 0;
              const altas = activos.filter(p => p.prioridad === "alta");
              return (
                <div key={co.id} style={{ marginBottom: 14, ...S.card, overflow: "hidden" }}>
                  <div style={{ padding: "14px 18px", borderBottom: "1px solid #e8e4de", display: "flex", alignItems: "center", justifyContent: "space-between", borderLeft: `4px solid ${co.color}` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontFamily: "'DM Mono'", fontSize: 10, color: co.color, background: `${co.color}18`, padding: "2px 8px", borderRadius: 4 }}>{co.short}</span>
                      <span style={{ fontSize: 13, fontWeight: 600 }}>{co.name}</span>
                    </div>
                    <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#aaa" }}>
                      {altas.length > 0 && <span style={{ color: "#C04A4A" }}>● {altas.length} críticos</span>}
                      <span>○ {activos.length} activos</span>
                      <span style={{ color: "#3A9E6B" }}>✓ {completados} completados</span>
                    </div>
                  </div>
                  <div style={{ padding: "12px 18px" }}>
                    <div style={{ height: 5, background: "#e8e4de", borderRadius: 3, marginBottom: 8, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: co.color, borderRadius: 3 }} />
                    </div>
                    <div style={{ fontSize: 11, color: "#aaa", marginBottom: altas.length > 0 ? 10 : 0 }}>{pct}% completado esta semana</div>
                    {altas.map(p => {
                      const su = p.subunit ? co.subunits?.find(s => s.id === p.subunit) : null;
                      return (
                        <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderTop: "1px solid #f0ede8" }}>
                          <span className="statcyc" onClick={() => cycleEstado(p.id)} style={{ fontSize: 13, color: p.estado === "en-proceso" ? co.accent : "#ccc" }}>{EST[p.estado]}</span>
                          {su && <span style={{ fontFamily: "'DM Mono'", fontSize: 9, color: su.color, background: `${su.color}12`, padding: "1px 6px", borderRadius: 3 }}>{su.short}</span>}
                          <span style={{ fontSize: 12, color: "#2a2a2a", flex: 1 }}>{p.texto}</span>
                          <Avatar name={p.responsable} color={co.color} size={20} />
                          <span style={{ fontSize: 10, color: "#bbb", fontFamily: "'DM Mono'" }}>{p.fecha}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ══ MODAL NUEVO PENDIENTE ══ */}
      {showModal && (
        <Modal title="Capturar pendiente" onClose={() => setShowModal(false)}>
          <Field label="Descripción *">
            <Input value={newP.texto} onChange={e => setNewP(p => ({ ...p, texto: e.target.value }))} onKeyDown={e => e.key === "Enter" && addPendiente()} placeholder="¿Qué hay que hacer?" autoFocus />
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <Field label="Empresa">
              <Select value={newP.empresa} onChange={e => setNewP(p => ({ ...p, empresa: e.target.value, subunit: null, responsable: "Yo" }))}>
                <option value="tecnocyclo">Tecnocyclo S.A.</option>
                <option value="karnatka">Karnatka S.A.</option>
                <option value="integraoffice">Integraoffice S.A.S</option>
              </Select>
            </Field>
            <Field label="Prioridad">
              <Select value={newP.prioridad} onChange={e => setNewP(p => ({ ...p, prioridad: e.target.value }))}>
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
              </Select>
            </Field>
          </div>
          {newP.empresa === "karnatka" && (
            <Field label="Unidad de negocio">
              <Select value={newP.subunit || ""} onChange={e => setNewP(p => ({ ...p, subunit: e.target.value || null, responsable: "Yo" }))}>
                <option value="">General</option>
                <option value="accesorios">Accesorios Automotrices</option>
                <option value="ciclismo">Ciclismo</option>
                <option value="penta">Penta (Software)</option>
              </Select>
            </Field>
          )}
          <Field label="Responsable">
            <Select value={newP.responsable} onChange={e => setNewP(p => ({ ...p, responsable: e.target.value }))}>
              {getEquipo(newP.empresa, newP.subunit).map(m => <option key={m} value={m}>{m}</option>)}
            </Select>
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
            <Field label="Área">
              <Input value={newP.area} onChange={e => setNewP(p => ({ ...p, area: e.target.value }))} placeholder="ej: Producción, RRHH..." />
            </Field>
            <Field label="Fecha límite">
              <Select value={newP.fecha} onChange={e => setNewP(p => ({ ...p, fecha: e.target.value }))}>
                <option>Hoy</option><option>Mañana</option><option>Esta semana</option><option>Próx. semana</option>
              </Select>
            </Field>
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
            <button onClick={() => setShowModal(false)} style={{ padding: "9px 18px", borderRadius: 8, border: "1px solid #ddd9d4", background: "transparent", color: "#888", cursor: "pointer", fontSize: 12 }}>Cancelar</button>
            <button onClick={addPendiente} disabled={!newP.texto.trim()} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: "#1e1e1e", color: "#faf8f5", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>Guardar</button>
          </div>
        </Modal>
      )}

      {/* ══ MODAL NUEVO MOVIMIENTO ══ */}
      {showMovModal && (
        <Modal title="Movimiento crítico del día" onClose={() => setShowMovModal(false)}>
          <Field label="¿Cuál es el movimiento?">
            <Input value={newMov.texto} onChange={e => setNewMov(m => ({ ...m, texto: e.target.value }))} onKeyDown={e => e.key === "Enter" && addMovimiento()} placeholder="ej: Cerrar contrato con proveedor X" autoFocus />
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
            <Field label="Empresa">
              <Select value={newMov.empresa} onChange={e => setNewMov(m => ({ ...m, empresa: e.target.value, subunit: null }))}>
                <option value="tecnocyclo">Tecnocyclo</option>
                <option value="karnatka">Karnatka</option>
                <option value="integraoffice">Integraoffice</option>
              </Select>
            </Field>
            {newMov.empresa === "karnatka" && (
              <Field label="Unidad">
                <Select value={newMov.subunit || ""} onChange={e => setNewMov(m => ({ ...m, subunit: e.target.value || null }))}>
                  <option value="">General</option>
                  <option value="accesorios">Accesorios</option>
                  <option value="ciclismo">Ciclismo</option>
                  <option value="penta">Penta</option>
                </Select>
              </Field>
            )}
          </div>
          <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
            <button onClick={() => setShowMovModal(false)} style={{ padding: "9px 18px", borderRadius: 8, border: "1px solid #ddd9d4", background: "transparent", color: "#888", cursor: "pointer", fontSize: 12 }}>Cancelar</button>
            <button onClick={addMovimiento} disabled={!newMov.texto.trim()} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: "#1e1e1e", color: "#faf8f5", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>Añadir</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
